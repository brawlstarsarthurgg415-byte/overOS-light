name: Build Meu OverOS APK
on:
  workflow_dispatch:
  push:
    paths:
      - "meu-overos/**"
      - ".github/workflows/meu-overos-apk.yml"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build independent Meu OverOS APK
        working-directory: meu-overos
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meu-OverOS-APK
          path: meu-overos/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
