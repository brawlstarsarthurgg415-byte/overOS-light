name: OverOS V2 - Gerar imagem IMG

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Versão do kernel Linux"
        required: true
        default: "6.12.1"
  push:
    branches:
      - overos-lite-v2
    paths:
      - "v2/**"
      - "android/**"
      - ".github/workflows/overos-v2-image.yml"

permissions:
  contents: read

concurrency:
  group: overos-v2-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Compilar imagem inicializável V2 (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Baixar código da V2
        uses: actions/checkout@v4
        with:
          ref: overos-lite-v2

      - name: Instalar ferramentas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            cpio xz-utils wget curl git grub-pc-bin parted e2fsprogs \
            qemu-system-x86 busybox-static fonts-dejavu-core golang-go

      - name: Compilar kernel Linux x86_64
        env:
          KERNEL_VERSION: ${{ inputs.kernel_version || '6.12.1' }}
        run: |
          set -eux
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VERSION}.tar.xz"
          tar -xf "linux-${KERNEL_VERSION}.tar.xz"
          cd "linux-${KERNEL_VERSION}"
          make x86_64_defconfig
          scripts/config --enable BLK_DEV_INITRD
          scripts/config --enable DEVTMPFS
          scripts/config --enable DEVTMPFS_MOUNT
          scripts/config --enable EXT4_FS
          scripts/config --enable EXT2_FS
          scripts/config --enable SCSI
          scripts/config --enable BLK_DEV_SD
          scripts/config --enable USB
          scripts/config --enable USB_STORAGE
          scripts/config --enable USB_EHCI_HCD
          scripts/config --enable USB_OHCI_HCD
          scripts/config --enable USB_UHCI_HCD
          scripts/config --enable USB_XHCI_HCD
          scripts/config --enable NETDEVICES
          scripts/config --enable ETHERNET
          scripts/config --enable E1000
          scripts/config --enable E1000E
          scripts/config --enable R8169
          scripts/config --enable VT
          scripts/config --enable VT_CONSOLE
          scripts/config --enable FB
          scripts/config --enable FB_VESA
          scripts/config --enable FB_EFI
          scripts/config --enable FRAMEBUFFER_CONSOLE
          scripts/config --enable VGA_CONSOLE
          scripts/config --enable FONT_8x16
          scripts/config --enable DRM
          scripts/config --enable DRM_SIMPLEDRM
          scripts/config --enable DRM_FBDEV_EMULATION
          scripts/config --enable DRM_I915
          scripts/config --enable INPUT_EVDEV
          make olddefconfig
          make -j"$(nproc)" bzImage
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/out/vmlinuz"

      - name: Compilar serviço seguro OverOS Pair
        run: |
          set -eux
          cd v2/pair
          gofmt -w main.go main_test.go
          go mod verify
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/out/over-pair" .
          file "$GITHUB_WORKSPACE/out/over-pair"

      - name: Montar initramfs mínimo OverOS com marca e Fastfetch
        run: |
          set -eux
          ROOT="$RUNNER_TEMP/overos-root"
          mkdir -p "$ROOT"/{bin,sbin,etc,proc,sys,dev,run,tmp,root,usr/bin,usr/share/overos,usr/share/udhcpc}
          chmod 1777 "$ROOT/tmp"
          cp /bin/busybox "$ROOT/bin/busybox"
          gcc -static -O2 -Wall -Wextra -o "$ROOT/usr/bin/over-shell" v2/desktop/over-shell.c
          chmod 0755 "$ROOT/usr/bin/over-shell"
          cp out/over-pair "$ROOT/usr/bin/over-pair"
          chmod 0755 "$ROOT/usr/bin/over-pair"
          for app in sh mount umount mkdir sleep uname free df cat clear reboot poweroff hostname tr udhcpc ifconfig route \
            ln ls awk grep sed cp mv chmod; do
            ln -sf busybox "$ROOT/bin/$app"
          done
          cp v2/apps/overosctl "$ROOT/usr/bin/overosctl"
          chmod 0755 "$ROOT/usr/bin/overosctl"
          ln -sf /usr/bin/overosctl "$ROOT/bin/overosctl"
          mkdir -p "$ROOT/usr/share/overos/overstore"
          cp v2/apps/overstore/index.html "$ROOT/usr/share/overos/overstore/index.html"
          cp v2/apps/overstore/store.css "$ROOT/usr/share/overos/overstore/store.css"
          cp v2/apps/overstore/store.js "$ROOT/usr/share/overos/overstore/store.js"
          cp v2/apps/overstore/CATALOGO.json "$ROOT/usr/share/overos/overstore/CATALOGO.json"
          cp v2/apps/overstore/README.md "$ROOT/usr/share/overos/overstore/README.md"
          mkdir -p "$ROOT/usr/share/overos/overbrowser"
          cp v2/apps/overbrowser/index.html "$ROOT/usr/share/overos/overbrowser/index.html"
          cp v2/apps/overbrowser/browser.css "$ROOT/usr/share/overos/overbrowser/browser.css"
          cp v2/apps/overbrowser/browser.js "$ROOT/usr/share/overos/overbrowser/browser.js"
          cp v2/apps/overbrowser/README.md "$ROOT/usr/share/overos/overbrowser/README.md"
          cp v2/branding/overos-logo-horizontal.svg "$ROOT/usr/share/overos/overos-logo.svg"
          mkdir -p "$ROOT/usr/share/overos/setup"
          cp v2/setup/firstboot.sh "$ROOT/usr/share/overos/setup/firstboot.sh"
          chmod 0755 "$ROOT/usr/share/overos/setup/firstboot.sh"
          cat > "$ROOT/init" <<'INIT'
          #!/bin/sh
          export PATH=/sbin:/bin:/usr/sbin:/usr/bin
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t devtmpfs devtmpfs /dev 2>/dev/null || true
          mount -t tmpfs tmpfs /run
          hostname OverOS
          mkdir -p /mnt/overos-data /run/overos-pair
          PAIR_DIR=/run/overos-pair
          # A partição que contém o GRUB também guarda os dados persistentes do Pair.
          for attempt in 1 2 3 4 5; do
            for dev in /dev/sd[a-z]1 /dev/vd[a-z]1 /dev/mmcblk*p1; do
              [ -b "$dev" ] || continue
              if mount -t ext2 -o rw "$dev" /mnt/overos-data 2>/dev/null; then
                if [ -f /mnt/overos-data/boot/grub/grub.cfg ]; then
                  PAIR_DIR=/mnt/overos-data/overos-data/pair
                  mkdir -p "$PAIR_DIR"
                  chmod 700 "$PAIR_DIR"
                  echo "Armazenamento persistente do OverOS encontrado."
                  break 2
                fi
                /bin/busybox umount /mnt/overos-data 2>/dev/null || true
              fi
            done
            sleep 1
          done
          # DHCP Ethernet; suporte Wi-Fi e credenciais serão adicionados após validar o chipset.
          mkdir -p /usr/share/udhcpc
          cat > /usr/share/udhcpc/default.script <<'DHCP'
          #!/bin/sh
          case "$1" in
            deconfig) ifconfig "$interface" 0.0.0.0 ;;
            bound|renew)
              ifconfig "$interface" "$ip" netmask "${subnet:-255.255.255.0}" up
              for r in $router; do route add default gw "$r" "$interface" 2>/dev/null || true; done
              : > /etc/resolv.conf
              for ns in $dns; do echo "nameserver $ns" >> /etc/resolv.conf; done
              ;;
          esac
          exit 0
          DHCP
          chmod 755 /usr/share/udhcpc/default.script
          for iface_path in /sys/class/net/eth* /sys/class/net/en*; do
            [ -e "$iface_path" ] || continue
            iface=${iface_path##*/}
            udhcpc -i "$iface" -q -n -t 5 -T 2 -s /usr/share/udhcpc/default.script >/run/udhcpc-"$iface".log 2>&1 &
          done
          clear
          echo
          echo "Bem-vindo ao OverOS Lite V2"
          if [ ! -f /etc/overos/setup.conf ]; then
            /usr/bin/over-shell --setup || /usr/share/overos/setup/firstboot.sh
          fi
          session=auto
          pair=no
          if [ -f /etc/overos/setup.conf ]; then . /etc/overos/setup.conf; fi
          echo "Usuario configurado: ${username:-over}"
          if [ "${pair:-no}" = yes ]; then
            echo "Iniciando pareamento solicitado pelo usuario..."
            /usr/bin/over-pair serve --state-dir "$PAIR_DIR" >/run/over-pair.log 2>&1 &
            echo $! >/run/over-pair.pid
            sleep 1
            /usr/bin/over-pair screen
          fi
          echo "Utilitarios leves: overosctl"
          if [ "$session" != terminal ] && [ -x /usr/bin/over-shell ]; then
            echo "Iniciando a interface grafica OverOS..."
            /usr/bin/over-shell || echo "Framebuffer indisponivel; iniciando terminal."
          fi
          echo "Digite overosctl para abrir os utilitarios."
          exec /bin/sh
          INIT
          chmod +x "$ROOT/init"
          mkdir -p out
          (cd "$ROOT" && find . -print0 | cpio --null -o --format=newc 2>/dev/null | gzip -9) > out/overos-initramfs.cpio.gz

      - name: Criar disco raw inicializável para BIOS Legacy
        run: |
          set -eux
          IMG="$GITHUB_WORKSPACE/out/overos-lite-v2.img"
          truncate -s 256M "$IMG"
          parted -s "$IMG" mklabel msdos
          parted -s "$IMG" mkpart primary ext2 1MiB 100%
          parted -s "$IMG" set 1 boot on
          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          cleanup() { sudo umount "$RUNNER_TEMP/overos-mnt" 2>/dev/null || true; sudo losetup -d "$LOOP" 2>/dev/null || true; }
          trap cleanup EXIT
          sudo mkfs.ext2 -F -L OVEROS "${LOOP}p1"
          sudo mkdir -p "$RUNNER_TEMP/overos-mnt"
          sudo mount "${LOOP}p1" "$RUNNER_TEMP/overos-mnt"
          sudo mkdir -p "$RUNNER_TEMP/overos-mnt/boot/grub/themes/overos" "$RUNNER_TEMP/overos-mnt/boot/grub/fonts" "$RUNNER_TEMP/overos-mnt/overos-data/pair"
          sudo chmod 700 "$RUNNER_TEMP/overos-mnt/overos-data/pair"
          sudo cp v2/boot/grub-theme/theme.txt "$RUNNER_TEMP/overos-mnt/boot/grub/themes/overos/theme.txt"
          sudo cp /usr/share/grub/unicode.pf2 "$RUNNER_TEMP/overos-mnt/boot/grub/fonts/unicode.pf2"
          sudo cp out/vmlinuz "$RUNNER_TEMP/overos-mnt/boot/vmlinuz"
          sudo cp out/overos-initramfs.cpio.gz "$RUNNER_TEMP/overos-mnt/boot/initramfs.cpio.gz"
          sudo tee "$RUNNER_TEMP/overos-mnt/boot/grub/grub.cfg" > /dev/null <<'GRUB'
          set timeout=5
          set default=0
          # Preserve o modo de vídeo VBE escolhido pelo GRUB para o kernel.
          set gfxpayload=keep
          if loadfont /boot/grub/fonts/unicode.pf2; then
            insmod gfxterm
            insmod all_video
            set gfxmode=auto
            terminal_output gfxterm
            set theme=/boot/grub/themes/overos/theme.txt
          fi
          menuentry "OverOS Lite V2 (experimental)" {
            linux /boot/vmlinuz console=tty0 video=vesafb loglevel=4
            initrd /boot/initramfs.cpio.gz
          }
          GRUB
          sudo grub-install --target=i386-pc --boot-directory="$RUNNER_TEMP/overos-mnt/boot" --recheck "$LOOP"
          sync
          sudo umount "$RUNNER_TEMP/overos-mnt"
          sudo losetup -d "$LOOP"
          trap - EXIT
          xz -T0 -z -k "$IMG"
          sha256sum "$IMG" "$IMG.xz" > out/SHA256SUMS.txt

      - name: Testar inicialização em QEMU
        run: |
          set +e
          timeout 25s qemu-system-x86_64 -m 512 -kernel out/vmlinuz \
            -initrd out/overos-initramfs.cpio.gz -nographic -no-reboot \
            -append "console=ttyS0" > out/qemu-boot.log 2>&1
          set -e
          grep -q "Bem-vindo ao OverOS Lite V2" out/qemu-boot.log

      - name: Publicar arquivos para download
        uses: actions/upload-artifact@v4
        with:
          name: OverOS-V2-IMG-experimental
          path: |
            out/overos-lite-v2.img
            out/overos-lite-v2.img.xz
            out/SHA256SUMS.txt
            out/qemu-boot.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  build-apk:
    name: Compilar APK Meu OverOS 2.9
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: overos-lite-v2
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compilar APK instalável
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-OverOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  package-downloads:
    name: Reunir APK e sistema para download
    needs: [build-image, build-apk]
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar imagem OverOS
        uses: actions/download-artifact@v4
        with:
          name: OverOS-V2-IMG-experimental
          path: package/system
      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: Meu-OverOS-APK
          path: package/android
      - name: Criar pacote único
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y zip
          mkdir -p package/Meu-OverOS-V2
          cp package/system/overos-lite-v2.img.xz package/Meu-OverOS-V2/
          cp package/system/overos-lite-v2.img package/Meu-OverOS-V2/
          cp package/android/app-debug.apk package/Meu-OverOS-V2/Meu-OverOS-2.9-debug.apk
          cp package/system/qemu-boot.log package/Meu-OverOS-V2/
          (cd package/Meu-OverOS-V2 && sha256sum overos-lite-v2.img overos-lite-v2.img.xz Meu-OverOS-2.9-debug.apk > SHA256SUMS.txt)
          cd package
          zip -r Meu-OverOS-e-Sistema-V2.zip Meu-OverOS-V2
      - name: Publicar pacote combinado
        uses: actions/upload-artifact@v4
        with:
          name: Meu-OverOS-e-Sistema-V2
          path: package/Meu-OverOS-e-Sistema-V2.zip
          if-no-files-found: error
          retention-days: 14
