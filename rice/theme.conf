# OverOS Rice — tokens iniciais de tema
# Valores de design; ainda não ligados a um compositor ou shell.

[colors]
background = #0b1020
surface = #121a2b
surface_alt = #1a263a
text = #e8f0ff
muted = #9aaac2
accent = #65e6f2
accent_secondary = #a78bfa
border = #2b3b55
warning = #f6c177
error = #ff7b86

[layout]
panel_height = 30
panel_padding = 8
window_gap = 6
corner_radius = 8
border_width = 1

[effects]
blur = false
animations = false
transparency = false
shadows = false

[performance]
video_wallpaper = false
startup_widgets = minimal
prefer_software_fallback = true
